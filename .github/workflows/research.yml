name: Evaluate contrarian research

on:
  push:
    branches: [research/**]
    paths:
      - research/run.py
      - .github/workflows/research.yml

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download verified Binance data and evaluate
        run: python3 research/run.py --output research/results.json
      - name: Store report on research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results.json
          git commit -m 'Store research results'
          git push
