name: Research and dashboard checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-quantdinger-demo.txt
      - run: python scripts/download_quantdinger.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/dashboard.test.cjs tests/workbuddy.test.cjs
